[package]
name = "missingno-gamedb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ron.workspace = true
serde.workspace = true
# Board vocabularies: a hardware payload names the same boards the emulator
# builds, so an unknown code is a parse error rather than a string nobody reads.
missingno-gb = { git = "https://github.com/ajoneil/missingno", branch = "main", default-features = false }
missingno-sg1000 = { git = "https://github.com/ajoneil/missingno", branch = "main", default-features = false }
missingno-vcs = { git = "https://github.com/ajoneil/missingno", branch = "main", default-features = false }

[dev-dependencies]
tempfile = "3"
